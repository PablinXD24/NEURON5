<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Nexus - Symbiosis Sphere</title>
    <style>
        /* --- BASE --- */
        body {
            margin: 0; padding: 0;
            background-color: #eef1f5;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(55, 97, 122, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(242, 56, 57, 0.08) 0%, transparent 25%);
            height: 100vh; width: 100vw; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
            perspective: 1000px; /* Necessário para o 3D */
        }

        #app-logo {
            position: fixed; top: 25px; left: 25px;
            width: 130px; height: auto; z-index: 500;
            pointer-events: none; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
        }

        /* --- MUNDO INFINITO (SOLO) --- */
        #viewport {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; cursor: grab; transition: filter 0.5s;
        }
        #viewport.blurred { filter: blur(8px) grayscale(80%); pointer-events: none; }
        
        #world {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            transform-origin: 0 0; will-change: transform;
        }

        .lines-layer {
            position: absolute; top: 0; left: 0; 
            width: 1px; height: 1px; overflow: visible; 
            pointer-events: none; z-index: 1;
        }

        .connection-line {
            fill: none; stroke-width: 2.5px; stroke-linecap: round;
            opacity: 0.8; filter: drop-shadow(0 0 3px rgba(0,0,0,0.1));
            vector-effect: non-scaling-stroke; 
        }

        /* --- BOLINHAS --- */
        .circle-wrapper {
            position: absolute; width: 28px; height: 28px; z-index: 10;
            transform: translate(-50%, -50%); 
        }

        .neon-circle {
            width: 100%; height: 100%; border-radius: 50%; cursor: pointer;
            animation-name: floatVertical; animation-timing-function: ease-in-out;
            animation-iteration-count: infinite; transition: background-color 0.5s, box-shadow 0.5s;
        }

        @keyframes floatVertical {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); } 
        }

        .message-tooltip {
            position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fff; padding: 4px 10px; border-radius: 20px;
            font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0;
            transition: opacity 0.2s; backdrop-filter: blur(2px);
        }
        .circle-wrapper:hover .message-tooltip { opacity: 1; }
        .zoom-out .message-tooltip { display: none !important; }


        /* --- DIMENSÃO DE SIMBIOSE --- */
        #symbiosis-dimension {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #10151a 0%, #000000 100%);
            z-index: 2000; 
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
        }
        #symbiosis-dimension.active { opacity: 1; pointer-events: auto; }

        /* Header da Simbiose */
        .symbiosis-header {
            position: absolute; top: 30px; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; box-sizing: border-box; pointer-events: none; z-index: 2001;
        }
        .symbiosis-title {
            color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 3px; font-weight: 700; font-size: 14px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        .header-actions { display: flex; gap: 15px; pointer-events: auto; }

        /* Botões do Header */
        .header-btn {
            background: rgba(255, 255, 255, 0.1); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px 15px; border-radius: 20px;
            cursor: pointer; backdrop-filter: blur(5px); transition: all 0.3s; font-weight: 600; font-size: 12px;
            display: flex; align-items: center; gap: 5px;
        }
        .header-btn:hover { background: rgba(255, 255, 255, 0.25); box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        
        #close-symbiosis { border-color: rgba(255, 50, 50, 0.4); color: #ff5555; }
        #close-symbiosis:hover { background: rgba(255, 50, 50, 0.3); box-shadow: 0 0 15px rgba(255,0,0,0.2); }

        /* --- VIEWS DA SIMBIOSE (MAPA VS ESFERA) --- */
        
        /* Container Genérico */
        .symbiosis-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; pointer-events: none; transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .symbiosis-view.active-view { opacity: 1; pointer-events: auto; transform: scale(1); }
        .symbiosis-view.hidden-view { opacity: 0; pointer-events: none; transform: scale(1.5); }

        /* Mapa 2D */
        #symbiosis-map-container { overflow: hidden; }
        #symbiosis-world {
            position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            transform: translate(-50%, -50%);
        }

        /* --- ESFERA 3D CSS --- */
        #sphere-view {
            perspective: 1200px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; /* Indica que pode clicar para entrar */
        }
        
        #neural-sphere {
            position: relative; width: 400px; height: 400px;
            transform-style: preserve-3d;
            animation: spin 20s infinite linear;
        }

        @keyframes spin {
            from { transform: rotateY(0) rotateX(20deg); }
            to { transform: rotateY(360deg) rotateX(20deg); }
        }

        .sphere-node {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            background: #fff; top: 50%; left: 50%;
            box-shadow: 0 0 15px currentColor;
            backface-visibility: visible;
        }
        
        /* Texto flutuando na esfera (opcional, para efeito) */
        .sphere-text {
            position: absolute; top: 50%; left: 50%; color: white; font-size: 24px; font-weight: 300;
            transform: translate(-50%, -50%); text-shadow: 0 0 20px rgba(41, 250, 16, 0.8);
            pointer-events: none; opacity: 0.8; letter-spacing: 5px;
        }


        /* --- UI INFERIOR --- */
        .bottom-ui-container {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; align-items: center; gap: 20px;
            transition: opacity 0.3s, transform 0.3s;
        }
        .hidden-ui { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(50px); }

        /* Sidebar */
        .morph-dock {
            position: relative; width: 60px; height: 60px; border-radius: 60px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px) saturate(200%); -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.8), 0 15px 35px rgba(0,0,0,0.15), 
                        -3px -3px 15px rgba(41, 250, 16, 0.4), 3px 3px 15px rgba(242, 56, 57, 0.4);
        }
        .morph-dock:not(.open):hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.5); }
        .morph-dock.open {
            width: 380px; height: 70px; border-radius: 50px;
            background: rgba(255, 255, 255, 0.6); cursor: default;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15), inset 0 0 20px rgba(255,255,255,0.5);
        }

        /* Botão Simbiose */
        .symbiosis-btn {
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5); cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .symbiosis-btn svg { width: 24px; height: 24px; fill: #555; transition: fill 0.3s; }
        .symbiosis-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.4); }
        .symbiosis-btn.searching { background: rgba(255, 255, 255, 0.8); border-color: #29FA10; animation: pulse-green 1.5s infinite; }
        .symbiosis-btn.searching svg { fill: #29FA10; }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(41, 250, 16, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(41, 250, 16, 0); }
            100% { box-shadow: 0 0 0 0 rgba(41, 250, 16, 0); }
        }

        /* Radar Overlay */
        .radar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 400; display: none; align-items: center; justify-content: center;
        }
        .radar-overlay.active { display: flex; }
        .radar-ring {
            position: absolute; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.1);
            width: 100px; height: 100px; animation: radar-expand 3s linear infinite;
        }
        .radar-ring:nth-child(2) { animation-delay: 1s; } .radar-ring:nth-child(3) { animation-delay: 2s; }
        @keyframes radar-expand {
            0% { width: 0; height: 0; opacity: 0.5; border-color: rgba(41, 250, 16, 0.8); }
            100% { width: 100vw; height: 100vw; opacity: 0; border-color: rgba(41, 250, 16, 0); }
        }

        /* Notification */
        .toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 12px 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 3000; font-weight: 600; color: #333; transition: transform 0.5s;
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast-icon { width: 10px; height: 10px; background: #29FA10; border-radius: 50%; box-shadow: 0 0 10px #29FA10; }

        /* UI Elements */
        .color-list { display: flex; gap: 25px; opacity: 0; pointer-events: none; transform: scale(0.8); transition: all 0.4s ease 0.1s; }
        .morph-dock.open .color-list { opacity: 1; pointer-events: auto; transform: scale(1); }
        .color-option-container { position: relative; }
        .color-option { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; }
        .color-option:hover { transform: scale(1.2); }
        .color-option.selected { transform: scale(1.1); border-color: #555; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .area-label { position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 5px 10px; border-radius: 8px; font-size: 11px; white-space: nowrap; opacity: 0; visibility: hidden; transition: opacity 0.2s; pointer-events: none; }
        .color-option-container:hover .area-label { opacity: 1; visibility: visible; }

        /* Popup */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(220, 220, 230, 0.3); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .popup-card { width: 360px; padding: 35px; border-radius: 30px; text-align: center; transform: scale(0.9); transition: transform 0.3s; background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); border-top: 4px solid transparent; }
        .popup-overlay.active { display: flex; opacity: 1; }
        .popup-overlay.active .popup-card { transform: scale(1); }
        .popup-title { margin: 0 0 5px 0; color: #444; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .ai-badge { font-size: 11px; color: #666; margin-bottom: 20px; display: block; font-weight: 500; opacity: 0.7; }
        textarea { width: 100%; height: 110px; padding: 15px; border-radius: 15px; border: none; background: rgba(255,255,255,0.5); box-shadow: inset 0 2px 10px rgba(0,0,0,0.05); font-family: inherit; resize: none; outline: none; box-sizing: border-box; margin-bottom: 25px; font-size: 16px; color: #333; }
        textarea:focus { background: rgba(255,255,255,0.85); }
        .popup-actions { display: flex; gap: 15px; }
        .btn { padding: 12px 0; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; flex: 1; transition: all 0.2s; font-size: 14px; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); filter: brightness(1.1); }
        .btn-save { color: #fff; box-shadow: 0 10px 20px -5px rgba(0,0,0,0.2); }
        .btn-delete { background: rgba(255,235,238, 0.8); color: #d32f2f; }

        @media (max-width: 600px) {
            #app-logo { width: 100px; top: 20px; left: 20px; }
            .morph-dock.open { width: 85vw; height: 80px; }
            .color-list { gap: 15px; }
            .color-option { width: 40px; height: 40px; }
            .popup-card { width: 85%; padding: 25px; }
            .message-tooltip { display: none; }
            .bottom-ui-container { width: 100%; justify-content: center; gap: 15px; bottom: 30px; }
            .symbiosis-header { padding: 0 20px; }
            .sphere-text { font-size: 18px; }
            #neural-sphere { width: 250px; height: 250px; }
        }
    </style>
</head>
<body>

    <img id="app-logo" src="https://raw.githubusercontent.com/PablinXD24/NEURON3/main/neuron%20logo%20branco.png" alt="Neuron Logo">

    <div class="radar-overlay" id="radarOverlay">
        <div class="radar-ring"></div><div class="radar-ring"></div><div class="radar-ring"></div>
    </div>

    <div class="toast" id="toast">
        <div class="toast-icon"></div>
        <span id="toastText">Simbiose Concluída</span>
    </div>

    <div id="viewport">
        <div id="world">
            <svg class="lines-layer" id="solo-lines">
                <defs id="grad-defs-solo"></defs>
            </svg>
        </div>
    </div>

    <div id="symbiosis-dimension">
        <div class="symbiosis-header">
            <div class="symbiosis-title">Fusão Neural</div>
            <div class="header-actions">
                <button id="toggle-view" class="header-btn">
                    <span>Alternar Visão</span>
                </button>
                <button id="close-symbiosis" class="header-btn">Encerrar</button>
            </div>
        </div>
        
        <div id="sphere-view" class="symbiosis-view">
            <div id="neural-sphere">
                </div>
            <div class="sphere-text">CONEXÃO ATIVA</div>
        </div>

        <div id="symbiosis-map-container" class="symbiosis-view">
            <div id="symbiosis-world">
                <svg class="lines-layer" id="symbiosis-lines">
                    <defs id="grad-defs-symbiosis"></defs>
                </svg>
            </div>
        </div>
    </div>

    <div class="bottom-ui-container" id="mainUI">
        <div class="morph-dock" id="morphDock">
            <div class="color-list" id="colorList"></div>
        </div>
        <div class="symbiosis-btn" id="symbiosisBtn" title="Ativar Simbiose">
            <svg viewBox="0 0 24 24"><path d="M18,6C15.6,6 13.8,7.3 12.5,9C11.2,7.3 9.4,6 7,6C3.9,6 1.5,8.2 1.5,11.5C1.5,14.8 4.2,17.5 7.5,17.5C9.6,17.5 11.2,16.2 12.5,14.5C13.8,16.2 15.4,17.5 17.5,17.5C20.8,17.5 23.5,14.8 23.5,11.5C23.5,8.2 21.1,6 18,6ZM7.5,15.5C5.3,15.5 3.5,13.7 3.5,11.5C3.5,9.3 5.3,7.5 7.5,7.5C9.2,7.5 10.3,8.7 11.1,9.8C10.3,13.3 9.2,15.5 7.5,15.5ZM17.5,15.5C15.8,15.5 14.7,13.3 13.9,9.8C14.7,8.7 15.8,7.5 17.5,7.5C19.7,7.5 21.5,9.3 21.5,11.5C21.5,13.7 19.7,15.5 17.5,15.5Z"/></svg>
        </div>
    </div>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-card" id="popupCard">
            <h3 class="popup-title" id="popupTitle">Nova Ideia</h3>
            <span class="ai-badge" id="aiBadge">Analisando...</span>
            <textarea id="popupInput" placeholder="Digite seu pensamento..."></textarea>
            <div class="popup-actions">
                <button class="btn btn-delete" id="btnDelete">Excluir</button>
                <button class="btn btn-save" id="btnSave">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        const lifeAreas = [
            { id: 'health', name: 'Saúde & Físico', color: '#29FA10', keywords: ['saude', 'saúde', 'corpo', 'academia', 'treino', 'dieta', 'comer', 'água', 'sono', 'médico', 'remédio', 'dor', 'doente', 'hospital', 'corrida', 'estresse'] },
            { id: 'mind', name: 'Mente & Intelecto', color: '#37617A', keywords: ['estudar', 'livro', 'ler', 'curso', 'faculdade', 'escola', 'aprender', 'inteligencia', 'foco', 'ideia', 'pensar', 'raciocinio', 'criatividade', 'escrever'] },
            { id: 'social', name: 'Relacionamentos', color: '#f23839', keywords: ['amor', 'namorado', 'casamento', 'mae', 'pai', 'filho', 'familia', 'amigo', 'festa', 'encontro', 'sexo', 'carinho', 'abraço', 'conversa', 'pessoas', 'briga'] },
            { id: 'career', name: 'Carreira & Finanças', color: '#f2ca50', keywords: ['trabalho', 'emprego', 'dinheiro', 'salario', 'pagar', 'boleto', 'conta', 'banco', 'chefe', 'projeto', 'meta', 'venda', 'empresa', 'carreira'] },
            { id: 'spirit', name: 'Espiritual & Emocional', color: '#378c4b', keywords: ['deus', 'fé', 'orar', 'meditar', 'paz', 'alma', 'espirito', 'gratidão', 'triste', 'feliz', 'ansiedade', 'sentimento', 'emoção', 'propósito', 'vibe'] }
        ];

        // REFS GERAIS
        const viewport = document.getElementById('viewport');
        const world = document.getElementById('world');
        const soloLinesLayer = document.getElementById('solo-lines');
        const gradDefsSolo = document.getElementById('grad-defs-solo');
        
        // REFS SIMBIOSE
        const symbiosisDimension = document.getElementById('symbiosis-dimension');
        const sphereView = document.getElementById('sphere-view');
        const neuralSphere = document.getElementById('neural-sphere');
        const symbiosisMapContainer = document.getElementById('symbiosis-map-container');
        const symbiosisWorld = document.getElementById('symbiosis-world');
        const symbiosisLinesLayer = document.getElementById('symbiosis-lines');
        const gradDefsSymbiosis = document.getElementById('grad-defs-symbiosis');
        const closeSymbiosisBtn = document.getElementById('close-symbiosis');
        const toggleViewBtn = document.getElementById('toggle-view');
        
        // UI
        const mainUI = document.getElementById('mainUI');
        const morphDock = document.getElementById('morphDock');
        const colorList = document.getElementById('colorList');
        const popupOverlay = document.getElementById('popupOverlay');
        const popupCard = document.getElementById('popupCard');
        const popupTitle = document.getElementById('popupTitle');
        const aiBadge = document.getElementById('aiBadge');
        const popupInput = document.getElementById('popupInput');
        const btnSave = document.getElementById('btnSave');
        const btnDelete = document.getElementById('btnDelete');
        const symbiosisBtn = document.getElementById('symbiosisBtn');
        const radarOverlay = document.getElementById('radarOverlay');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');

        let bubblesArray = [];
        let symbiosisBubblesArray = [];
        let activeArea = lifeAreas[0];
        let currentBubble = null;
        let isSymbiosisActive = false;
        let currentSymbiosisView = 'sphere'; // 'sphere' ou 'map'

        // --- ZOOM & PAN (SOLO) ---
        let worldX = 0, worldY = 0, scale = 1, isPanning = false, startPanX = 0, startPanY = 0;

        function updateWorldTransform() {
            world.style.transform = `translate(${worldX}px, ${worldY}px) scale(${scale})`;
            if (scale < 0.6) document.body.classList.add('zoom-out'); else document.body.classList.remove('zoom-out');
        }

        viewport.addEventListener('wheel', (e) => {
            if(isSymbiosisActive) return;
            e.preventDefault(); const delta = e.deltaY < 0 ? 1 : -1;
            const newScale = Math.min(Math.max(0.1, scale + (delta * 0.1)), 5);
            const mouseX = e.clientX - worldX; const mouseY = e.clientY - worldY;
            worldX -= mouseX * (newScale / scale - 1); worldY -= mouseY * (newScale / scale - 1);
            scale = newScale; updateWorldTransform();
        }, { passive: false });

        function getEventPos(e) { return (e.touches && e.touches.length > 0) ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }

        viewport.addEventListener('mousedown', (e) => {
            if(isSymbiosisActive) return;
            if (e.target === viewport || e.target === world || e.target.id === 'solo-lines') {
                isPanning = true; const pos = getEventPos(e); startPanX = pos.x - worldX; startPanY = pos.y - worldY;
                viewport.style.cursor = 'grabbing';
            }
        });
        window.addEventListener('mousemove', (e) => {
            if (isPanning && !isSymbiosisActive) {
                e.preventDefault(); const pos = getEventPos(e); worldX = pos.x - startPanX; worldY = pos.y - startPanY;
                updateWorldTransform();
            }
        });
        window.addEventListener('mouseup', () => { isPanning = false; viewport.style.cursor = 'grab'; });

        // --- SIMBIOSE ---
        symbiosisBtn.addEventListener('click', () => {
            if (isSymbiosisActive) return;
            symbiosisBtn.classList.add('searching'); radarOverlay.classList.add('active');
            setTimeout(() => { activateSymbiosisMode(); }, 3000);
        });

        function activateSymbiosisMode() {
            symbiosisBtn.classList.remove('searching'); radarOverlay.classList.remove('active');
            isSymbiosisActive = true;
            viewport.classList.add('blurred'); symbiosisDimension.classList.add('active');
            mainUI.classList.add('hidden-ui');
            showToast("Sinal Encontrado: Fusão Realizada");
            
            // Inicia na ESFERA
            switchSymbiosisView('sphere');
            generateSymbiosisData(); // Gera dados
            generateSphereVisuals(); // Gera visual 3D
        }

        // --- VISUAL ESFERA 3D ---
        function generateSphereVisuals() {
            neuralSphere.innerHTML = '';
            // Gera 50 nós na esfera
            const count = 50;
            for (let i = 0; i < count; i++) {
                const node = document.createElement('div');
                node.classList.add('sphere-node');
                
                // Distribuição esférica (Fibonacci Sphere algorithm simplificado para CSS)
                // Usando transformações rotateY e rotateX
                const y = 1 - (i / (count - 1)) * 2;
                const radius = Math.sqrt(1 - y * y);
                const theta = i * 2.4; // Golden angle increment
                
                const r = 200; // Raio da esfera em px
                const xPos = Math.cos(theta) * radius * r;
                const yPos = y * r;
                const zPos = Math.sin(theta) * radius * r;

                node.style.transform = `translate3d(${xPos}px, ${yPos}px, ${zPos}px)`;
                
                // Cores aleatórias das áreas
                const randomArea = lifeAreas[Math.floor(Math.random() * lifeAreas.length)];
                node.style.backgroundColor = randomArea.color;
                node.style.color = randomArea.color; // Para o box-shadow usar currentColor

                neuralSphere.appendChild(node);
            }
        }

        // --- TROCA DE VISÃO (ESFERA <-> MAPA) ---
        function switchSymbiosisView(viewType) {
            currentSymbiosisView = viewType;
            if (viewType === 'sphere') {
                sphereView.classList.remove('hidden-view');
                sphereView.classList.add('active-view');
                symbiosisMapContainer.classList.remove('active-view');
                symbiosisMapContainer.classList.add('hidden-view');
                toggleViewBtn.innerHTML = '<span>Ver Mapa</span>';
            } else {
                sphereView.classList.remove('active-view');
                sphereView.classList.add('hidden-view');
                symbiosisMapContainer.classList.remove('hidden-view');
                symbiosisMapContainer.classList.add('active-view');
                toggleViewBtn.innerHTML = '<span>Ver Esfera</span>';
            }
        }

        // CLIQUE NA ESFERA PARA ENTRAR NO MAPA
        sphereView.addEventListener('click', () => switchSymbiosisView('map'));
        
        // BOTÃO TOGGLE
        toggleViewBtn.addEventListener('click', () => {
            switchSymbiosisView(currentSymbiosisView === 'sphere' ? 'map' : 'sphere');
        });

        // BOTÃO FECHAR
        closeSymbiosisBtn.addEventListener('click', () => {
            isSymbiosisActive = false;
            viewport.classList.remove('blurred'); symbiosisDimension.classList.remove('active');
            mainUI.classList.remove('hidden-ui');
            
            // Limpa dados
            while (symbiosisLinesLayer.querySelectorAll('line').length > 0) symbiosisLinesLayer.removeChild(symbiosisLinesLayer.lastChild);
            gradDefsSymbiosis.innerHTML = '';
            const oldBubbles = symbiosisWorld.querySelectorAll('.circle-wrapper');
            oldBubbles.forEach(b => b.remove());
            symbiosisBubblesArray = [];
        });

        function generateSymbiosisData() {
            symbiosisBubblesArray = [];
            
            // Clona dados do user
            bubblesArray.forEach(b => {
                createSymbiosisBubble(
                    parseInt(b.wrapper.style.left) - 200, 
                    parseInt(b.wrapper.style.top), 
                    b.area, b.tooltip.innerText, b.scores
                );
            });
            // Cria parceiro
            const partnerData = [
                { t: "Estudar IA", a: "mind", x: 200, y: 0 },
                { t: "Maratona", a: "health", x: 250, y: 150 },
                { t: "Comprar Casa", a: "career", x: 150, y: -100 },
                { t: "Yoga", a: "spirit", x: 300, y: -50 }
            ];
            partnerData.forEach(p => {
                const area = lifeAreas.find(a => a.id === p.a);
                const scores = analyzeFullContext(p.t).scores;
                createSymbiosisBubble(p.x, p.y, area, p.t, scores);
            });
        }

        function createSymbiosisBubble(x, y, area, text, scores) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('circle-wrapper');
            wrapper.style.left = `${x}px`; wrapper.style.top = `${y}px`;
            const circle = document.createElement('div');
            circle.classList.add('neon-circle');
            circle.style.backgroundColor = area.color;
            circle.style.boxShadow = `0 0 10px ${area.color}, 0 0 25px ${area.color}90`;
            circle.style.animationDuration = `${(Math.random()*3+4).toFixed(2)}s`;
            const tooltip = document.createElement('div');
            tooltip.classList.add('message-tooltip'); tooltip.innerText = text;
            circle.appendChild(tooltip); wrapper.appendChild(circle); symbiosisWorld.appendChild(wrapper);
            
            // Adiciona ao array de simbiose
            const bubbleObj = { wrapper, circle, area, scores, id: Math.random() };
            symbiosisBubblesArray.push(bubbleObj);
            
            // APENAS ARRASTAR (SEM CLICK PARA EDITAR)
            setupSimpleDrag(wrapper);
        }

        function setupSimpleDrag(wrapper) {
            let isDragging = false; let startX, startY, initX, initY;
            wrapper.addEventListener('mousedown', (e) => {
                e.stopPropagation(); isDragging = true;
                startX = e.clientX; startY = e.clientY;
                initX = parseInt(wrapper.style.left); initY = parseInt(wrapper.style.top);
                const move = (evt) => {
                    if(!isDragging) return;
                    wrapper.style.left = `${initX + (evt.clientX - startX)}px`;
                    wrapper.style.top = `${initY + (evt.clientY - startY)}px`;
                }
                const up = () => { isDragging = false; window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); }
                window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
            });
        }

        // --- SOLO LOGIC ---
        function createBubble(x, y, area, text = "", existingId = null, existingScores = {}) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('circle-wrapper');
            wrapper.style.left = `${x}px`; wrapper.style.top = `${y}px`;
            const circle = document.createElement('div');
            circle.classList.add('neon-circle');
            circle.style.backgroundColor = area.color;
            circle.style.boxShadow = `0 0 10px ${area.color}, 0 0 25px ${area.color}90`;
            circle.style.animationDuration = `${(Math.random()*3+4).toFixed(2)}s`;
            const tooltip = document.createElement('div');
            tooltip.classList.add('message-tooltip'); tooltip.innerText = text;
            circle.appendChild(tooltip); wrapper.appendChild(circle); world.appendChild(wrapper);
            const bubbleObj = { id: existingId || (Date.now()+Math.random()), wrapper, circle, area, tooltip, scores: existingScores };
            bubblesArray.push(bubbleObj);
            setupInteraction(bubbleObj);
            if (!text && !existingId) openPopup(bubbleObj);
        }

        function setupInteraction(bubbleObj) {
            let isDraggingBubble = false; let dragStartX, dragStartY, initialBubbleLeft, initialBubbleTop;
            const wrapper = bubbleObj.wrapper;
            function onBubbleStart(e) { e.stopPropagation(); isDraggingBubble = false; const pos = getEventPos(e); dragStartX = pos.x; dragStartY = pos.y; initialBubbleLeft = parseInt(wrapper.style.left||0); initialBubbleTop = parseInt(wrapper.style.top||0); if(e.type === 'mousedown') { window.addEventListener('mousemove', onBubbleMove); window.addEventListener('mouseup', onBubbleEnd); } else { window.addEventListener('touchmove', onBubbleMove, {passive: false}); window.addEventListener('touchend', onBubbleEnd); } }
            function onBubbleMove(e) { isDraggingBubble = true; e.preventDefault(); const pos = getEventPos(e); const dx = (pos.x - dragStartX)/scale; const dy = (pos.y - dragStartY)/scale; wrapper.style.left = `${initialBubbleLeft + dx}px`; wrapper.style.top = `${initialBubbleTop + dy}px`; }
            function onBubbleEnd(e) { if(e.type === 'mouseup') { window.removeEventListener('mousemove', onBubbleMove); window.removeEventListener('mouseup', onBubbleEnd); } else { window.removeEventListener('touchmove', onBubbleMove); window.removeEventListener('touchend', onBubbleEnd); } if(!isDraggingBubble) openPopup(bubbleObj); else saveData(); }
            wrapper.addEventListener('mousedown', onBubbleStart); wrapper.addEventListener('touchstart', onBubbleStart, {passive: false});
        }

        function openPopup(bubbleObj) {
            currentBubble = bubbleObj; popupInput.value = bubbleObj.tooltip.innerText; updatePopupStyle(bubbleObj.area); popupOverlay.classList.add('active'); setTimeout(() => popupInput.focus(), 100);
        }
        function updatePopupStyle(area) { popupCard.style.borderTopColor = area.color; popupTitle.style.color = area.color; popupTitle.innerText = area.name; aiBadge.innerText = `Contexto: ${area.name}`; btnSave.style.backgroundColor = area.color; }
        function closePopup() { popupOverlay.classList.remove('active'); currentBubble = null; }
        btnSave.addEventListener('click', () => { if (currentBubble) { const text = popupInput.value.trim(); currentBubble.tooltip.innerText = text; const result = analyzeFullContext(text); currentBubble.scores = result.scores; if (result.dominant && result.dominant.id !== currentBubble.area.id) { currentBubble.area = result.dominant; currentBubble.circle.style.backgroundColor = result.dominant.color; currentBubble.circle.style.boxShadow = `0 0 10px ${result.dominant.color}, 0 0 25px ${result.dominant.color}90`; } saveData(); } closePopup(); });
        popupInput.addEventListener('input', (e) => { const result = analyzeFullContext(e.target.value); if(result.dominant) updatePopupStyle(result.dominant); });
        btnDelete.addEventListener('click', () => { if (currentBubble) { currentBubble.wrapper.remove(); bubblesArray = bubblesArray.filter(b => b.id !== currentBubble.id); saveData(); } closePopup(); });
        popupOverlay.addEventListener('click', (e) => { if (e.target === popupOverlay) closePopup(); });
        
        function analyzeFullContext(text) { if (!text) return { dominant: null, scores: {} }; const cleanText = text.toLowerCase(); let scores = {}; let maxScore = 0; let dominantArea = null; lifeAreas.forEach(area => scores[area.id] = 0); lifeAreas.forEach(area => { area.keywords.forEach(word => { if (cleanText.includes(word)) scores[area.id] += 1; }); if (scores[area.id] > maxScore) { maxScore = scores[area.id]; dominantArea = area; } }); return { dominant: dominantArea, scores: scores }; }
        function saveData() { const data = bubblesArray.map(b => ({ id: b.id, x: parseInt(b.wrapper.style.left), y: parseInt(b.wrapper.style.top), text: b.tooltip.innerText, areaId: b.area.id, scores: b.scores })); localStorage.setItem('neuralNexusProData', JSON.stringify(data)); }
        function loadData() { const data = localStorage.getItem('neuralNexusProData'); if (data) { const parsed = JSON.parse(data); parsed.forEach(item => { const area = lifeAreas.find(a => a.id === item.areaId) || lifeAreas[0]; createBubble(item.x, item.y, area, item.text, item.id, item.scores); }); } }
        window.addEventListener('load', loadData);
        morphDock.addEventListener('click', () => morphDock.classList.toggle('open'));
        lifeAreas.forEach((area, index) => { const container = document.createElement('div'); container.classList.add('color-option-container'); const dot = document.createElement('div'); dot.classList.add('color-option'); dot.style.backgroundColor = area.color; const label = document.createElement('div'); label.classList.add('area-label'); label.innerText = area.name; if(index === 0) { dot.classList.add('selected'); activeArea = area; } dot.addEventListener('click', (e) => { e.stopPropagation(); document.querySelectorAll('.color-option').forEach(d => d.classList.remove('selected')); dot.classList.add('selected'); activeArea = area; }); container.appendChild(label); container.appendChild(dot); colorList.appendChild(container); });
        
        let lastTap = 0;
        function handleCreateGesture(e) {
            if(isSymbiosisActive) return;
            if(e.target !== viewport && e.target !== world && e.target.id !== 'solo-lines') return;
            const currentTime = new Date().getTime(); const tapLength = currentTime - lastTap;
            if (e.type === 'dblclick' || (e.type === 'touchend' && tapLength < 300 && tapLength > 0)) {
                e.preventDefault(); const pos = getEventPos(e.changedTouches ? e.changedTouches[0] : e);
                const realX = (pos.x - worldX) / scale; const realY = (pos.y - worldY) / scale;
                createBubble(realX, realY, activeArea); saveData();
            } lastTap = currentTime;
        }
        viewport.addEventListener('dblclick', handleCreateGesture); viewport.addEventListener('touchend', handleCreateGesture);
        function showToast(msg) { toastText.innerText = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 4000); }

        // --- SISTEMA DE CONEXÃO GENÉRICO (COM GRADIENTES) ---
        function updateLinesGeneric(targetArray, linesLayerRef, defsLayerRef, containerElement, useScale) {
            while (linesLayerRef.querySelectorAll('line').length > 0) linesLayerRef.removeChild(linesLayerRef.lastChild);
            defsLayerRef.innerHTML = ''; 
            
            const rectRef = containerElement.getBoundingClientRect(); 
            const currentScale = useScale ? scale : 1;

            for (let i = 0; i < targetArray.length; i++) {
                const b1 = targetArray[i];
                let targetBubble = null;

                for (let j = i + 1; j < targetArray.length; j++) {
                    const candidate = targetArray[j];
                    if (b1.area.id === candidate.area.id) { targetBubble = candidate; break; }
                }
                if (!targetBubble) {
                    for (let j = i + 1; j < targetArray.length; j++) {
                        const candidate = targetArray[j];
                        const b1HasContext = (b1.scores && b1.scores[candidate.area.id] > 0);
                        const b2HasContext = (candidate.scores && candidate.scores[b1.area.id] > 0);
                        const shared = lifeAreas.some(a => b1.scores && candidate.scores && b1.scores[a.id]>0 && candidate.scores[a.id]>0);
                        if (b1HasContext || b2HasContext || shared) { targetBubble = candidate; break; }
                    }
                }

                if (targetBubble) {
                    const b2 = targetBubble;
                    const rect1 = b1.circle.getBoundingClientRect();
                    const rect2 = b2.circle.getBoundingClientRect();

                    const x1 = (rect1.left - rectRef.left + (rect1.width/2)) / currentScale;
                    const y1 = (rect1.top - rectRef.top + (rect1.height/2)) / currentScale;
                    const x2 = (rect2.left - rectRef.left + (rect2.width/2)) / currentScale;
                    const y2 = (rect2.top - rectRef.top + (rect2.height/2)) / currentScale;

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                    line.classList.add('connection-line');
                    
                    if (b1.area.id === b2.area.id) { 
                        line.setAttribute('stroke', b1.area.color); 
                    } else { 
                        const gradId = `grad-${Math.random().toString(36).substr(2, 9)}`;
                        const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                        gradient.setAttribute('id', gradId);
                        gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
                        gradient.setAttribute('x1', x1); gradient.setAttribute('y1', y1);
                        gradient.setAttribute('x2', x2); gradient.setAttribute('y2', y2);
                        
                        const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                        stop1.setAttribute('offset', '0%'); stop1.setAttribute('stop-color', b1.area.color);
                        const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                        stop2.setAttribute('offset', '100%'); stop2.setAttribute('stop-color', b2.area.color);
                        
                        gradient.appendChild(stop1); gradient.appendChild(stop2);
                        defsLayerRef.appendChild(gradient);
                        line.setAttribute('stroke', `url(#${gradId})`);
                    }
                    linesLayerRef.appendChild(line);
                }
            }
        }

        function gameLoop() {
            if (!isSymbiosisActive) {
                updateLinesGeneric(bubblesArray, soloLinesLayer, gradDefsSolo, world, true);
            } else {
                // Só desenha linhas se estiver na visão de MAPA (não na esfera)
                if(currentSymbiosisView === 'map') {
                    updateLinesGeneric(symbiosisBubblesArray, symbiosisLinesLayer, gradDefsSymbiosis, symbiosisWorld, false);
                }
            }
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

    </script>
